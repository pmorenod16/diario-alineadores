name: App Android

# Construye el APK y lo publica en «Releases» con el nombre diario-alineadores.apk.
# Enlace de descarga permanente:
#   https://github.com/pmorenod16/diario-alineadores/releases/latest/download/diario-alineadores.apk
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app/**", "scripts/android-setup.mjs", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          (cd scripts && npm install --no-audit --no-fund)
          (cd app && npm install --no-audit --no-fund)

      - name: Crear proyecto Android
        working-directory: app
        run: npx cap add android

      - name: Registrar la app en Firebase y preparar la firma
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/android-setup.mjs "$RUNNER_TEMP/diario.jks" app/android/app/google-services.json

      - name: Configurar compilación (Google, firma, iconos)
        working-directory: app
        run: |
          # incluir el proveedor de Google del plugin de autenticación
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          # firmar la versión final con nuestra clave
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "diario"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          # versión = número de compilación de GitHub, para que el móvil acepte la actualización
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx @capacitor/assets generate --android --iconBackgroundColor '#17806F' --splashBackgroundColor '#F3F6F5'
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk diario-alineadores.apk
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" diario-alineadores.apk \
            --title "Diario de Alineadores $TAG" \
            --notes "Descarga **diario-alineadores.apk** en el móvil y ábrelo para instalar o actualizar la app." \
            --latest
