name: Recordatorios

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub suele retrasarlo; cada ejecución revisa cada 5 min durante 55 min
  workflow_dispatch: {}       # para probarlo a mano desde la pestaña Actions
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/recordatorios.yml"]

# Solo una a la vez: la siguiente espera en cola y empieza cuando acaba la anterior.
concurrency:
  group: recordatorios-${{ github.event_name == 'schedule' && 'horario' || github.run_id }}
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Enviar recordatorios y avisos
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '55' || '0' }}
          DIAGNOSE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node recordatorios.mjs
